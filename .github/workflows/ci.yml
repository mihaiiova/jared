name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - name: Short canonical macOS test paths
        if: runner.os == 'macOS'
        run: echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Generated runtime matches source
        shell: bash
        run: |
          git status --short --untracked-files=all -- dist/src vendor/tools
          test -z "$(git status --porcelain --untracked-files=all -- dist/src vendor/tools)"
      - run: npm run test:git-install
      - run: npm pack --dry-run
      - run: git diff --check
