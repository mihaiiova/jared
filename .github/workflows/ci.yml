name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
      - name: Native test prerequisites
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew list fd >/dev/null 2>&1 || brew install fd
            brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
            # A short canonical temp root also respects Unix socket path limits.
            echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y fd-find ripgrep
          fi
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Generated runtime matches source
        run: git diff --exit-code -- dist/src
      - run: npm run test:git-install
      - run: npm pack --dry-run
      - run: git diff --check
